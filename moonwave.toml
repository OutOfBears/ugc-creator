[home]
enabled = true
includeReadme = false

[[home.features]]
title = "Component-based"
description = "Paired Server/Client components drive every entity, registered through the in-repo Component system."

[[home.features]]
title = "Typed networking"
description = "All client/server traffic flows through one typed Network module — never raw RemoteEvents."

[[home.features]]
title = "Replicated state"
description = "Per-instance state replicates server to client through the shared AttributeReplicator."

[[home.features]]
title = "Documented inline"
description = "Shared utilities, services, and controllers carry Moonwave docs generated straight from the source."

